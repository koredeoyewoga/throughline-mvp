# Netlify deployment for the Throughline Coordinate demo.
# See docs/DEPLOY.md. Set THROUGHLINE_SESSION_SECRET in the Netlify UI
# (Site settings → Environment variables) before the first deploy.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Next.js runtime for Netlify (App Router, RSC, middleware as an Edge Function).
# Netlify applies this automatically for Next sites; pinned here for clarity.
[[plugins]]
  package = "@netlify/plugin-nextjs"
